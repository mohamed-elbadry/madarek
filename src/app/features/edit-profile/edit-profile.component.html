  <app-header [title]="'تعديل حسابي'" [closemodal]="true" [gobackbtn]="true"> </app-header>

<div class="modal-poup pi-10">
 

  <div class="profile-wrapper">
    <div class="image ion-align-items-center ion-justify-content-center ion-text-center">
      <!-- صورة الملف الشخصي -->
      <img src="../../assets/img/home/Avatar-5.png" class="edit-img">
    </div>


    <div class="form-group">
      <label>الإسم :</label>
      <input type="text" class="fw-regular" placeholder="أحمد عبد العزيز">
    </div>



    <div class="form-group phone-group">
      <label>رقم الجوال :</label>
      <div class="phone-input-wrapper">
        <input type="tel" class="fw-regular" placeholder="054 25877455">
        <img src="../../assets/img/icon/verified.svg">
      </div>

    </div>
    <div class="form-group email">
      <label>البريد الإلكتروني :</label>
      <input type="email" placeholder="أضف بريدك الإلكتروني">
    </div>
    <div class="custom-button ">
      <ion-buttons slot="start">
        <ion-button fill="outline" expand="block" class="custom-btn">
          انضم لفريق مدارك كمرشد أو مستشار
        </ion-button>
      </ion-buttons>
    </div>

    <!-- <h2 class="delete">
      <img src="../../assets/img/icon/exit-orang.svg" alt="icon">
      حذف العضوية
    </h2> -->


    <h2 class="delete" id="deletemembership">
      <img src="../../assets/img/icon/exit-orang.svg" alt="icon">
      حذف العضوية
    </h2>
  </div>
</div>

<!-- 🔹 الهيدر -->

<ion-modal #modal trigger="deletemembership" class="delete-modal" >

  <ng-template>
    <div class="modal-content">
      <h3 class="text-red fw-black fs-20">هل أنت متأكد؟</h3>
      <span class="text-primary fw-medium">من حذف عضويتك لدى مدارك ؟</span>
      <p class="fw-regular fs-14 text-primary">سيتم حذف كافة البيانات والخدمات التي قمت بشرائها ولن يمكنك الوصول إليها
        مستقبلاً</p>
      <div class="buttons">
        <ion-button class="btn-blue" (click)="confirmDelete()">
          <img src="../../assets/img/icon/check.svg" alt="check" class="pe-10">
          نعم
        </ion-button>

        <ion-button fill="outline" class="btn-green" (click)="modal.dismiss()">
          تراجع
        </ion-button>
      </div>

    </div>
  </ng-template>
</ion-modal>
